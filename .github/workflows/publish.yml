name: Publish

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'preprocess/cli' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.14.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install supported npm
        run: npm install --global npm@11.18.0

      - name: Verify tag and immutable source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          node -e 'const manifest = require("./package.json"); if (process.env.RELEASE_TAG !== `v${manifest.version}`) throw new Error(`Tag ${process.env.RELEASE_TAG} does not match package version ${manifest.version}`); if (manifest.name !== "@preprocess/cli") throw new Error(`Unexpected package ${manifest.name}`)'
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$SOURCE_SHA")"

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Check public contracts
        run: pnpm check

      - name: Test public contracts and clean consumer
        run: pnpm test

      - name: Build distribution
        run: pnpm build

      - name: Inspect package dry run
        run: |
          mkdir -p release
          npm pack --dry-run --json > release/npm-pack-dry-run.json

      - name: Pack release artifact
        id: pack
        run: |
          npm pack --json --pack-destination release > release/npm-pack.json
          echo "tarball=release/$(node -p 'JSON.parse(require("fs").readFileSync("release/npm-pack.json", "utf8"))[0].filename')" >> "$GITHUB_OUTPUT"

      - name: Verify exact release artifact
        env:
          RELEASE_TARBALL: ${{ steps.pack.outputs.tarball }}
        run: node test/release-package.js "$RELEASE_TARBALL"

      - name: Publish exact verified artifact
        env:
          RELEASE_TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm publish "$RELEASE_TARBALL" --access public --provenance --json > release/npm-publish.json

      - name: Record release evidence
        if: success()
        env:
          RELEASE_TARBALL: ${{ steps.pack.outputs.tarball }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          node test/release-evidence.js \
            --tarball "$RELEASE_TARBALL" \
            --pack release/npm-pack.json \
            --publish release/npm-publish.json \
            --sha "$SOURCE_SHA" \
            --output release/release-evidence.json

      - name: Upload release evidence
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: npm-release-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 90
